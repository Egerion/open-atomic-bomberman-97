name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            preset: linux
            ctest_dir: build/linux
          - name: macOS (Clang)
            os: macos-latest
            preset: macos
            ctest_dir: build/macos
          # Pinned to windows-2022 (not windows-latest): the windows-fetch preset
          # uses the "Visual Studio 17 2022" generator, and once GitHub rolls
          # windows-latest forward to an image without VS 2022 the generator errors
          # with "could not find any instance of Visual Studio". windows-2022
          # guarantees the matching toolset.
          - name: Windows (MSVC)
            os: windows-2022
            preset: windows-fetch
            ctest_dir: build/windows-fetch
            ctest_config: Release

    steps:
      - uses: actions/checkout@v4

      # SDL3 is built from source (BOMBER_FETCH_SDL3=ON). On Linux it needs the
      # X11/Wayland/audio dev headers to enable its video/audio backends; the
      # test suite itself is SDL-free and runs headless, so no display is used.
      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # ctest suites are self-contained (synthetic fixtures, no original game
      # assets). Windows is a multi-config generator, so it needs -C Release;
      # the single-config Unix presets do not.
      - name: Test
        run: ctest --test-dir ${{ matrix.ctest_dir }} ${{ matrix.ctest_config && format('-C {0}', matrix.ctest_config) || '' }} --output-on-failure
