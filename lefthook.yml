# Local push gate — see CLAUDE.md "Build & test" / "Code standards".
# `lefthook install` wires this into .git/hooks/pre-push (not committed;
# every clone/worktree must run it once — see README).
pre-push:
  parallel: true
  commands:
    tests:
      run: bash scripts/test.sh
    lint:
      run: bash scripts/lint.sh
    # .clang-format was advisory until this was added — nothing ran it, and 170
    # of 333 files had drifted. It checks only the LINES a push changes (see
    # scripts/format.sh), so it does not demand a repo-wide reformat commit.
    format:
      run: bash scripts/format.sh
