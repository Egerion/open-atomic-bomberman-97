# Fly.io deploy example for the Open Bomberman matchmaker (ADR-0011).
# `fly launch --no-deploy` to create the app, then `fly deploy`.
#
# TLS: Fly terminates HTTPS/WSS at its edge (force_https below) and forwards
# plain ws:// to the container, so the binary needs no cert — leave TLSCert/Key
# unset. Clients connect to wss://<app>.fly.dev/ws.
#
# UDP (STUN echo + relay): Fly UDP needs a dedicated IPv4 (`fly ips
# allocate-v4`) and the process must bind the Fly-provided address, so both
# listeners use "fly-global-services:<port>" and observe real client addresses.
#
# MATCHMAKER_RELAY_ADVERTISE is what clients are told to dial for relayed
# matches — EDIT IT to this app's real hostname. A relayed match routes all
# per-tick traffic through this machine (README "Relay: bandwidth & cost");
# check your egress allowance before leaving the relay open to the public.

app = "open-bomberman-matchmaker"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  MATCHMAKER_WS_ADDR = ":8080"
  MATCHMAKER_STUN_ADDR = "fly-global-services:8081"
  MATCHMAKER_RELAY_ADDR = "fly-global-services:8082"
  MATCHMAKER_RELAY_ADVERTISE = "open-bomberman-matchmaker.fly.dev:8082"
  MATCHMAKER_RELAY_IDLE = "60s"
  MATCHMAKER_LOG_LEVEL = "info"
  MATCHMAKER_HEARTBEAT_INTERVAL = "10s"
  MATCHMAKER_HEARTBEAT_MISS = "3"
  # Fly's edge OVERWRITES this header with the real client address, and every
  # connection otherwise arrives from a private Fly address — without it the
  # per-IP connection cap and the per-IP lobby-code-guess budget are both inert
  # (SECURITY.md "Operator notes"). Never point this at a raw X-Forwarded-For:
  # the leftmost entry of an appended chain is attacker-controlled.
  MATCHMAKER_CLIENT_IP_HEADER = "Fly-Client-IP"

# WebSocket control plane (TLS terminated at the edge).
[http_service]
  internal_port = 8080
  # NOT force_https: the game's WS client is currently built WITHOUT TLS
  # (IXWebSocket v11.4.6's mbedTLS backend does not compile against any single
  # mbedTLS release — see cmake/BomberIXWebSocket.cmake), so it dials ws://.
  # With force_https the edge answers that with a 301 the client cannot follow
  # and the lobby never connects. Turning it off does NOT disable HTTPS — wss://
  # keeps working for anything that can speak it; it only stops the redirect.
  #
  # TRADE-OFF, and a SERIOUS one — SECURITY.md S1. Signalling then travels in the
  # clear, and it does carry credentials: the host_token (which authorises
  # StartMatch), the lobby code (which is the whole authn for joining a "private"
  # lobby) and the relay alloc_id all cross the wire readable, alongside the
  # roster, display names and candidate ip:ports. A passive observer on the path
  # therefore gets host authority over the lobby, not just a peek at it.
  #
  # Flip this back to true the moment the client speaks wss:// — that is the fix,
  # and it lives on the client side, not here.
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Deliberately /readyz, NOT /healthz. A failing check here gets the machine
  # restarted, and this app runs on exactly one machine holding every lobby in
  # RAM — so an automatic restart is not a recovery, it destroys precisely what
  # it is meant to protect: every match in progress dies. /readyz goes down only
  # when the process is deliberately draining, so the check still does its real
  # job (route traffic away during a deploy) while nothing transient can bounce
  # the machine mid-match.
  #
  # /healthz is the liveness view (both UDP read loops + the lobby reaper) and
  # CAN return 503, unlike the constant "ok" it used to be. It stays available
  # and worth watching — a genuinely wedged read loop shows up there — it just
  # does not auto-trigger a restart. The trade-off, stated plainly: a real wedge
  # now needs a human to notice it.
  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "2s"

# UDP STUN echo. Requires a dedicated IPv4 address on the app.
[[services]]
  protocol = "udp"
  internal_port = 8081

  [[services.ports]]
    port = 8081

# UDP relay forwarder (PROTOCOL.md §6). Same dedicated IPv4.
[[services]]
  protocol = "udp"
  internal_port = 8082

  [[services.ports]]
    port = 8082
